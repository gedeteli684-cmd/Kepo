name: Build Wrapper APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encrypt APK asli
        run: python3 encrypt_apk.py

      - name: Make gradlew executable
        run: chmod +x wrapper-apk/gradlew

      - name: Build Wrapper APK
        run: |
          cd wrapper-apk
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-release
          path: wrapper-apk/app/build/outputs/apk/release/*.apk
