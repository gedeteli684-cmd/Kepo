name: Build Wrapper APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'

      - name: Encrypt APK asli
        run: python3 encrypt_apk.py

      - name: Build Wrapper APK
        run: |
          cd wrapper-apk
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: wrapper-release
          path: wrapper-apk/app/build/outputs/apk/release/*.apk
